# Reusable: one signed Android release artifact, either the APK or the App
# Bundle. deploy.yml calls it once per target so the two builds run in
# parallel instead of back to back.
name: Android build

on:
  workflow_call:
    inputs:
      target:
        description: "flutter build target: apk or appbundle"
        required: true
        type: string

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  build:
    name: Build signed ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Caches the Gradle distribution and dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: flutter pub get

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Use the repository-wide GitHub run ID instead of a workflow run number.
      # run_number resets per workflow, which can otherwise create duplicate
      # Play version codes when multiple workflows build an App Bundle.
      - name: Build
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          BUILD_NUMBER="$GITHUB_RUN_ID"
          flutter build ${{ inputs.target }} --release \
            --dart-define=BACKEND_MODE=firebase \
            --build-number="$BUILD_NUMBER"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload APK
        if: inputs.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: workaxis-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload App Bundle
        if: inputs.target == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: workaxis-appbundle-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
