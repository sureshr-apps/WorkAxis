# Reusable: one signed Android release artifact, either the APK or the App
# Bundle. deploy.yml calls it once per target so the two builds run in
# parallel instead of back to back.
name: Android build

on:
  workflow_call:
    inputs:
      target:
        description: "flutter build target: apk or appbundle"
        required: true
        type: string
      build_name:
        description: "Optional Android version name, for example 1.0.1"
        required: false
        type: string
        default: ""

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  build:
    name: Build signed ${{ inputs.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      # Caches the Gradle distribution and dependencies between runs.
      - uses: gradle/actions/setup-gradle@v4

      - run: flutter pub get

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # Use the repository-wide run ID to avoid per-workflow run-number clashes,
      # but keep the result below Android's 2.1B version-code limit. The modulo
      # interval is large enough that it will not wrap during normal use.
      - name: Build
        env:
          TARGET: ${{ inputs.target }}
          BUILD_NAME: ${{ inputs.build_name }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          if [[ "$TARGET" != "apk" && "$TARGET" != "appbundle" ]]; then
            echo "Unsupported Android build target: $TARGET" >&2
            exit 1
          fi

          BUILD_NUMBER=$((GITHUB_RUN_ID % 2000000000 + 100))
          BUILD_ARGS=(--build-number="$BUILD_NUMBER")
          if [[ -n "$BUILD_NAME" ]]; then
            if [[ ! "$BUILD_NAME" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
              echo "Build name must be a three-part numeric version, got: $BUILD_NAME" >&2
              exit 1
            fi
            BUILD_ARGS+=(--build-name="$BUILD_NAME")
          fi

          flutter build "$TARGET" --release \
            --dart-define=BACKEND_MODE=firebase \
            "${BUILD_ARGS[@]}"

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - name: Upload APK
        if: inputs.target == 'apk'
        uses: actions/upload-artifact@v4
        with:
          name: workaxis-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
          if-no-files-found: error

      - name: Upload App Bundle
        if: inputs.target == 'appbundle'
        uses: actions/upload-artifact@v4
        with:
          name: workaxis-appbundle-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
