# Runs on every push to main (and on demand). Only the parts a push touches run:
#   changes -> verify (always)
#   verify + changes -> database migrations (functions/db changed)
#   verify + changes + database -> backend deploy (functions or rules changed)
#   verify + changes + backend -> web build and deploy (app code or hosting config changed)
#   changes -> signed Android APK (app code changed)
#   changes -> signed App Bundle (manual run only)
# A manual run (workflow_dispatch) deploys everything.
#
# Google Cloud access is keyless: the GitHub OIDC token is exchanged through
# Workload Identity Federation for the workaxis-deployer service account, and
# only this repository's main branch is allowed to do that (see docs/ci-cd.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one halfway through.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  FIREBASE_TOOLS_VERSION: "15.22.3"
  FIREBASE_PROJECT: workaxis-app

jobs:
  changes:
    name: Detect changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      database: ${{ steps.filter.outputs.database }}
      backend: ${{ steps.filter.outputs.backend }}
      app: ${{ steps.filter.outputs.app }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Compares the commits in this push. Anything else (a manual run, or a
      # push whose previous commit is unknown) counts as changed everywhere.
      - id: filter
        env:
          EVENT_NAME: ${{ github.event_name }}
          BEFORE: ${{ github.event.before }}
        run: |
          if [ "$EVENT_NAME" = "push" ] && [ -n "$BEFORE" ] && [ "$BEFORE" != "0000000000000000000000000000000000000000" ]; then
            changed=$(git diff --name-only "$BEFORE" "$GITHUB_SHA")
          else
            changed=$(git ls-files)
          fi
          matches() {
            if printf '%s\n' "$changed" | grep -Eq "$1"; then echo true; else echo false; fi
          }
          {
            echo "database=$(matches '^functions/db/')"
            echo "backend=$(matches '^(functions/|firebase\.json$|firestore\.rules$|firestore\.indexes\.json$|storage\.rules$|\.firebaserc$)')"
            echo "app=$(matches '^(lib/|web/|android/|assets/|pubspec\.(yaml|lock)$|firebase\.json$)')"
          } >> "$GITHUB_OUTPUT"

  verify:
    uses: ./.github/workflows/verify.yml

  database:
    name: Apply database migrations
    needs: [verify, changes]
    if: ${{ needs.changes.outputs.database == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DB_MODE: cloudsql
      DB_NAME: workaxis
      DB_INSTANCE_CONNECTION_NAME: omniretail-60c71:asia-south1:omniretail-sql
      DB_USER: workaxis-deployer@workaxis-app.iam
      # Table owner role, so new tables get its default privileges for the app.
      DB_MIGRATION_ROLE: firebaseowner_workaxis_public
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Idempotent and recorded in schema_migrations; migrations must stay
      # backward compatible because the previous backend is still running.
      - run: node db/migrate.mjs

  backend:
    name: Deploy functions, rules and indexes
    needs: [verify, changes, database]
    # database is skipped when no migration changed; that must not block the deploy.
    if: ${{ always() && needs.verify.result == 'success' && needs.changes.outputs.backend == 'true' && (needs.database.result == 'success' || needs.database.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      # firebase.json runs the functions build as a predeploy step.
      - name: Deploy
        run: >
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy
          --only functions,firestore,storage
          --project ${{ env.FIREBASE_PROJECT }}
          --non-interactive --force

  web:
    name: Build and deploy web
    # Waits for the backend so the new web app never calls operations that
    # are not deployed yet; a skipped backend (no backend change) is fine.
    needs: [verify, changes, backend]
    if: ${{ always() && needs.verify.result == 'success' && needs.changes.outputs.app == 'true' && (needs.backend.result == 'success' || needs.backend.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --dart-define=BACKEND_MODE=firebase

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy hosting
        run: >
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy
          --only hosting
          --project ${{ env.FIREBASE_PROJECT }}
          --non-interactive

  android:
    name: Android APK
    # Not gated on verify, so the build runs alongside the checks. If verify
    # fails, the deploy jobs do not run; check verify before installing an APK.
    needs: [changes]
    if: ${{ needs.changes.outputs.app == 'true' }}
    uses: ./.github/workflows/android.yml
    with:
      target: apk
    secrets: inherit

  android-bundle:
    name: Android App Bundle
    # The App Bundle is for Play uploads, so it is built only on a manual run.
    needs: [changes]
    if: ${{ github.event_name == 'workflow_dispatch' && needs.changes.outputs.app == 'true' }}
    uses: ./.github/workflows/android.yml
    with:
      target: appbundle
    secrets: inherit
