# Runs on every push to main (and on demand):
#   verify -> database migrations -> backend deploy -> web deploy
#   verify -> signed Android build (APK + AAB)
#
# Google Cloud access is keyless: the GitHub OIDC token is exchanged through
# Workload Identity Federation for the workaxis-deployer service account, and
# only this repository's main branch is allowed to do that (see docs/ci-cd.md).
name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Never run two deployments at once, and never cancel one halfway through.
concurrency:
  group: deploy-main
  cancel-in-progress: false

env:
  FLUTTER_VERSION: "3.47.0"
  FIREBASE_TOOLS_VERSION: "15.22.3"
  FIREBASE_PROJECT: workaxis-app

jobs:
  verify:
    uses: ./.github/workflows/verify.yml

  database:
    name: Apply database migrations
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    env:
      DB_MODE: cloudsql
      DB_NAME: workaxis
      DB_INSTANCE_CONNECTION_NAME: omniretail-60c71:asia-south1:omniretail-sql
      DB_USER: workaxis-deployer@workaxis-app.iam
      # Table owner role, so new tables get its default privileges for the app.
      DB_MIGRATION_ROLE: firebaseowner_workaxis_public
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Idempotent and recorded in schema_migrations; migrations must stay
      # backward compatible because the previous backend is still running.
      - run: node db/migrate.mjs

  backend:
    name: Deploy functions, rules and indexes
    needs: [verify, database]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci
        working-directory: functions

      # firebase.json runs the functions build as a predeploy step.
      - name: Deploy
        run: >
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy
          --only functions,firestore,storage
          --project ${{ env.FIREBASE_PROJECT }}
          --non-interactive --force

  web:
    name: Build and deploy web
    needs: [verify, backend]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - run: flutter build web --release --dart-define=BACKEND_MODE=firebase

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SERVICE_ACCOUNT }}

      - name: Deploy hosting
        run: >
          npx --yes firebase-tools@${{ env.FIREBASE_TOOLS_VERSION }} deploy
          --only hosting
          --project ${{ env.FIREBASE_PROJECT }}
          --non-interactive

  android:
    name: Build signed Android release
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Restore upload keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/upload.jks"
          echo "ANDROID_KEYSTORE_PATH=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      # The run number is the Android versionCode, so every build installs
      # over the previous one.
      - name: Build APK and App Bundle
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          flutter build apk --release --dart-define=BACKEND_MODE=firebase \
            --build-number=${{ github.run_number }}
          flutter build appbundle --release --dart-define=BACKEND_MODE=firebase \
            --build-number=${{ github.run_number }}

      - name: Remove keystore
        if: always()
        run: rm -f "$RUNNER_TEMP/upload.jks"

      - uses: actions/upload-artifact@v4
        with:
          name: workaxis-android-${{ github.run_number }}
          path: |
            build/app/outputs/flutter-apk/app-release.apk
            build/app/outputs/bundle/release/app-release.aab
          retention-days: 30
          if-no-files-found: error
