# Pull requests and feature branches: verify only. Nothing is deployed and no
# secrets are used, so this is safe for pull requests from forks.
name: CI

on:
  pull_request:
  push:
    branches-ignore:
      - main

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    uses: ./.github/workflows/verify.yml
