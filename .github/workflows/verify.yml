# Reusable quality gate: static analysis and tests for the app and the functions.
# Called by ci.yml (pull requests) and deploy.yml (pushes to main) so both run
# exactly the same checks. The Flutter tests run as two parallel shards.
name: Verify

on:
  workflow_call:

permissions:
  contents: read

env:
  FLUTTER_VERSION: "3.47.0"

jobs:
  flutter-analyze:
    name: Format and analyze
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      - name: Formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze
        run: flutter analyze

  flutter-test:
    name: Test (shard ${{ matrix.shard }} of 2)
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - run: flutter pub get

      # Test files are sorted by size and dealt alternately to the two shards,
      # so both shards finish at about the same time.
      - name: Test
        run: |
          files=$(find test -name '*_test.dart' -printf '%s %p\n' \
            | sort -rn \
            | awk -v shard="${{ matrix.shard }}" 'NR % 2 == shard { print $2 }')
          flutter test $files

  functions:
    name: Functions build and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: functions
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      - run: npm ci

      # Builds with tsc (type errors fail here) and runs the node:test suite.
      - run: npm test

  rules:
    name: Firestore rules tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: functions/package-lock.json

      # The Firestore emulator needs a recent JDK.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - run: npm ci
        working-directory: functions

      - name: Run rules tests against the emulator
        run: >
          npx --yes firebase-tools@15.22.3 emulators:exec
          --only firestore --project demo-workaxis
          "npm --prefix functions run test:rules"
