# Publish a signed App Bundle to the configured Google Play closed testing track
# when Android app changes reach main. Manual validation remains available.
name: Publish Android closed test

on:
  push:
    branches: [main]
    paths:
      - "android/**"
      - "assets/**"
      - "lib/**"
      - "pubspec.yaml"
      - "pubspec.lock"
  workflow_dispatch:
    inputs:
      validate_only:
        description: Validate Play access and the bundle without publishing
        required: true
        type: boolean
        default: true

permissions:
  contents: read

concurrency:
  group: play-closed-test
  cancel-in-progress: false

jobs:
  guard:
    name: Validate Play release settings
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      PLAY_CLOSED_TEST_TRACK: ${{ vars.PLAY_CLOSED_TEST_TRACK }}
      GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT: ${{ vars.GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT }}
      GCP_WORKLOAD_IDENTITY_PROVIDER: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
    steps:
      - name: Require main and a closed testing track
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != "refs/heads/main" ]]; then
            echo "Run this workflow from the main branch."
            exit 1
          fi
          if [[ -z "$PLAY_CLOSED_TEST_TRACK" ]]; then
            echo "Set the PLAY_CLOSED_TEST_TRACK repository variable to the Google Play API track identifier."
            exit 1
          fi
          if [[ "$PLAY_CLOSED_TEST_TRACK" == "production" ]]; then
            echo "This workflow only publishes to a testing track; production is not allowed."
            exit 1
          fi
          if [[ -z "$GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT" ]]; then
            echo "Set the GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT repository variable."
            exit 1
          fi
          if [[ -z "$GCP_WORKLOAD_IDENTITY_PROVIDER" ]]; then
            echo "Set the GCP_WORKLOAD_IDENTITY_PROVIDER repository variable."
            exit 1
          fi

  version:
    name: Select closed-test version
    needs: [guard]
    runs-on: ubuntu-latest
    outputs:
      build_name: ${{ steps.select.outputs.build_name }}
      tag_name: ${{ steps.select.outputs.tag_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select version
        id: select
        env:
          VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
        shell: bash
        run: |
          set -euo pipefail

          base_version="$(sed -nE 's/^version:[[:space:]]*((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))(\+[0-9]+)?[[:space:]]*$/\1/p' pubspec.yaml | head -n 1)"
          if [[ ! "$base_version" =~ ^(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "pubspec.yaml must define a numeric three-part base version, got: $base_version" >&2
            exit 1
          fi

          latest_tag_version="$(git tag --list 'play-v*' \
            | sed -nE 's/^play-v((0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*))$/\1/p' \
            | sort -V \
            | tail -n 1)"
          current_version="$base_version"
          if [[ -n "$latest_tag_version" ]]; then
            current_version="$(printf '%s\n%s\n' "$base_version" "$latest_tag_version" | sort -V | tail -n 1)"
          fi

          if [[ "$VALIDATE_ONLY" == "true" ]]; then
            build_name="$current_version"
            tag_name=""
          else
            IFS='.' read -r major minor patch <<< "$current_version"
            build_name="$major.$minor.$((patch + 1))"
            tag_name="play-v$build_name"
          fi

          echo "build_name=$build_name" >> "$GITHUB_OUTPUT"
          echo "tag_name=$tag_name" >> "$GITHUB_OUTPUT"
          echo "Selected Android version name: $build_name"

  verify:
    needs: [guard]
    if: ${{ !inputs.validate_only }}
    uses: ./.github/workflows/verify.yml

  android-bundle:
    name: Build signed App Bundle
    needs: [guard, version]
    uses: ./.github/workflows/android.yml
    with:
      target: appbundle
      build_name: ${{ needs.version.outputs.build_name }}
    secrets: inherit

  publish:
    name: Validate or upload to Google Play testing track
    needs: [guard, version, verify, android-bundle]
    if: ${{ always() && needs.guard.result == 'success' && needs.version.result == 'success' && needs.android-bundle.result == 'success' && (inputs.validate_only || needs.verify.result == 'success') }}
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write
    env:
      PLAY_CLOSED_TEST_TRACK: ${{ vars.PLAY_CLOSED_TEST_TRACK }}
      VALIDATE_ONLY: ${{ github.event_name == 'workflow_dispatch' && inputs.validate_only }}
    steps:
      - uses: actions/checkout@v4

      - name: Download signed App Bundle
        uses: actions/download-artifact@v4
        with:
          name: workaxis-appbundle-${{ github.run_number }}
          path: build/app/outputs/bundle/release

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ vars.GCP_PLAY_PUBLISHER_SERVICE_ACCOUNT }}
          create_credentials_file: true

      - uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.4"

      - name: Install Fastlane
        run: gem install fastlane --version 2.242.0 --no-document

      - name: Validate or publish closed test release
        run: |
          fastlane supply \
            --json_key "$GOOGLE_APPLICATION_CREDENTIALS" \
            --aab build/app/outputs/bundle/release/app-release.aab \
            --package_name com.sureshrapps.workaxis \
            --track "$PLAY_CLOSED_TEST_TRACK" \
            --release_status completed \
            --skip_upload_metadata true \
            --skip_upload_changelogs true \
            --skip_upload_images true \
            --skip_upload_screenshots true \
            --validate_only "$VALIDATE_ONLY"

  record-version:
    name: Record successfully published version
    needs: [version, publish]
    if: ${{ needs.publish.result == 'success' && !inputs.validate_only }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Create version tag
        env:
          PLAY_BUILD_NAME: ${{ needs.version.outputs.build_name }}
          PLAY_VERSION_TAG: ${{ needs.version.outputs.tag_name }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$PLAY_VERSION_TAG" -m "WorkAxis closed test $PLAY_BUILD_NAME"
          git push origin "$PLAY_VERSION_TAG"
