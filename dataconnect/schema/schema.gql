# WorkAxis Relational Core Schema (Firebase SQL Connect / PostgreSQL)
#
# OrganizationMember is the authoritative record for membership, role, status
# and branch assignments. Firebase Auth custom claims and the Firestore
# `users/{uid}` profile are projections written only by Cloud Functions.
# Valid values (not enforceable as DB enums in Data Connect; validated in
# connector operations and in Cloud Functions):
#   role   : platformOwner | platformAdmin | orgAdmin | branchManager | employee
#   status : active | suspended        (organization, branch, member)
#   return : pending | approved | rejected

type Organization @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  name: String!
  code: String! @unique
  category: String
  country: String
  status: String! @default(value: "active")
  currency: String @default(value: "INR")
  logoUrl: String
  taxIdentification: String
  description: String
  contactName: String
  contactEmail: String
  contactPhone: String
  address: String
  createdAt: Timestamp! @default(expr: "request.time")
}

type Branch @table @unique(fields: ["organization", "code"]) {
  creationRequestKey: String @unique
  creationFingerprint: String
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  organization: Organization!
  name: String!
  code: String!
  location: String
  status: String! @default(value: "active")
  isMainBranch: Boolean! @default(value: false)
  geofenceRadiusMeters: Int @default(value: 100)
  latitude: Float
  longitude: Float
  kioskEnabled: Boolean @default(value: false)
  createdAt: Timestamp! @default(expr: "request.time")
}

type OrganizationMember @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  # Null for platform-level roles (platformOwner, platformAdmin).
  organization: Organization
  # Firebase Auth uid. Nullable only so pre-provisioning seed rows can exist;
  # every member created by the provisionUser function has it set.
  authUid: String @unique
  fullName: String!
  username: String! @unique
  # Login email. When the admin supplies none, provisionUser stores a
  # synthetic `<username>@login.workaxis.invalid` address.
  email: String! @unique
  phone: String @unique
  role: String!
  status: String! @default(value: "active")
  createdAt: Timestamp! @default(expr: "request.time")
}

type UserBranchAssignment @table @unique(fields: ["member", "branch"]) {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  member: OrganizationMember!
  branch: Branch!
  assignedAt: Timestamp! @default(expr: "request.time")
}

type CommercialAgreement @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  organization: Organization!
  agreementReference: String! @unique
  planName: String!
  planTier: String!
  negotiatedPrice: Float!
  annualMaintenancePrice: Float!
  maxStores: Int!
  maxUsers: Int!
  startDate: Date!
  expiryDate: Date!
  status: String! @default(value: "active")
  createdAt: Timestamp! @default(expr: "request.time")
}

type LicenseEvent @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  organization: Organization!
  eventType: String! # LICENSE_ASSIGNED, PLAN_CHANGED, TERMS_MODIFIED, RENEWED
  planName: String!
  planTier: String!
  validityPeriod: String!
  storesCount: Int!
  usersCount: Int!
  oneTimePrice: Float!
  annualMaintenancePrice: Float!
  createdAt: Timestamp! @default(expr: "request.time")
}

type ReturnRecord @table {
  id: String! @col(name: "id") @default(expr: "uuidV4()")
  organization: Organization!
  branch: Branch!
  # Legacy member id as supplied by the client; employeeUid (server-stamped
  # from auth.uid) is the authoritative submitter identity.
  employeeId: String!
  employeeUid: String
  employeeName: String!
  # Legacy columns kept for compatibility: customerName carried the product
  # title and amount carried the quantity. New writes populate productTitle,
  # quantity and unit as well.
  customerName: String!
  amount: Float!
  productTitle: String
  quantity: Float
  unit: String
  invoiceNumber: String!
  status: String! @default(value: "pending")
  returnReason: String!
  billImageUrl: String
  remarks: String
  reviewerNotes: String
  reviewerUid: String
  reviewerName: String
  reviewedAt: Timestamp
  createdAt: Timestamp! @default(expr: "request.time")
}
