# WorkAxis Mutations
#
# Identity-bearing writes (OrganizationMember, UserBranchAssignment, roles,
# status) are NOT exposed to clients: they are performed by Cloud Functions
# (provisionUser, updateUserAccount, setUserStatus) using the Admin SDK.
# Claims referenced below: role, organizationId, branchIds, status.
# Unset optional variables must be OMITTED by the client.

# ---------------------------------------------------------------------------
# Organizations (platform only)
# ---------------------------------------------------------------------------

mutation CreateOrganization(
  $id: String
  $name: String!
  $code: String!
  $category: String
  $country: String
  $status: String
  $currency: String
  $taxIdentification: String
  $description: String
  $contactName: String
  $contactEmail: String
  $contactPhone: String
  $address: String
)
@auth(expr: "auth.token.status == 'active' && auth.token.role in ['platformOwner','platformAdmin'] && (!has(vars.status) || vars.status in ['active','suspended'])") {
  organization_insert(data: {
    id: $id
    name: $name
    code: $code
    category: $category
    country: $country
    status: $status
    currency: $currency
    taxIdentification: $taxIdentification
    description: $description
    contactName: $contactName
    contactEmail: $contactEmail
    contactPhone: $contactPhone
    address: $address
  })
}

# Writes category as its own column (no more description-prefix encoding).
# `status` cannot be changed here: suspension must also revoke member claims,
# so it goes through the setOrganizationStatus callable.
mutation UpdateOrganization(
  $id: String!
  $name: String
  $status: String
  $category: String
  $country: String
  $currency: String
  $logoUrl: String
  $taxIdentification: String
  $description: String
  $contactName: String
  $contactEmail: String
  $contactPhone: String
  $address: String
)
@auth(expr: "auth.token.status == 'active' && auth.token.role in ['platformOwner','platformAdmin'] && !has(vars.status)") {
  organization_update(
    id: $id
    data: {
      name: $name
      category: $category
      country: $country
      currency: $currency
      logoUrl: $logoUrl
      taxIdentification: $taxIdentification
      description: $description
      contactName: $contactName
      contactEmail: $contactEmail
      contactPhone: $contactPhone
      address: $address
    }
  )
}

