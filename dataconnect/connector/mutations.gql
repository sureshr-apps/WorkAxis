    existing: returnRecord(id: $id)
    @check(
      expr: "this != null && this.status == 'pending' && ((auth.token.role == 'orgAdmin' && this.organization.id == auth.token.organizationId) || (auth.token.role == 'branchManager' && this.branch.id in auth.token.branchIds))"
      message: "Return not found, already reviewed, or access denied."
    ) {
      id
      status
      organization { id }
      branch { id }
    }
  }
  returnRecord_update(
    id: $id
